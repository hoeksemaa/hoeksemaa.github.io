url: "https://hoeksemaa.github.io"
baseurl: ""
title: John's homepage
description: Meandering

collections:
    projects:
        output: true
        permalink: /projects/:name
    videos:
        output: true
        permalink: /videos/:name

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "videos"
    values:
      layout: "default"

markdown: kramdown
theme: minima

plugins:
  - jekyll-redirect-from
